<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrackChain — Purchase Management</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="shell">
    <aside class="sidebar" id="sidebar-mount"></aside>
    <div class="shell-main">
        <header class="shell-header">
            <div>
                <h1>Purchase Management</h1>
            </div>
        </header>

        <main class="shell-content">

            <section class="stat-grid">
                <div class="stat-card">
                    <div class="stat-label">Purchases recorded</div>
                    <div class="stat-value" id="stat-purchase-count">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Units purchased (all-time)</div>
                    <div class="stat-value" id="stat-units">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total spend (all-time)</div>
                    <div class="stat-value accent" id="stat-spend">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Distinct products purchased</div>
                    <div class="stat-value" id="stat-distinct-products">—</div>
                </div>
            </section>

            <div class="card full-width">
                <h2>Purchase inventory</h2>
                <!-- FIX: deleting a purchase now safely reverses the stock it added
                     (blocked if that stock's already been sold) -- see the Delete
                     button in Purchase history below. There's still no Edit, since
                     changing quantity/cost after the fact has no safe equivalent. -->
                <!-- FIX: shown instead of a raw insert error when a supplier/warehouse/product doesn't exist yet -->
                <div id="purchase-prereq-warning"></div>
                <form id="purchase-form">
                    <div class="form-row two-col">
                        <div>
                            <label for="purchase-supplier">Supplier</label>
                            <select id="purchase-supplier" required></select>
                        </div>
                        <div>
                            <label for="purchase-warehouse">Warehouse</label>
                            <select id="purchase-warehouse" required></select>
                        </div>
                    </div>
                    <label for="purchase-product">Product</label>
                    <!-- FIX: this list is now filtered to only the selected supplier's products,
                         instead of letting you pair any product with any supplier -->
                    <select id="purchase-product" required></select>
                    <div id="purchase-no-product-note" class="status-msg status-error" style="display:none;"></div>
                    <div class="form-row two-col">
                        <div>
                            <label for="purchase-quantity">Quantity</label>
                            <input type="number" id="purchase-quantity" min="1" value="1" required>
                        </div>
                        <div>
                            <label for="purchase-cost">Unit cost</label>
                            <input type="number" id="purchase-cost" class="no-spinner" min="0" step="1" required>
                        </div>
                    </div>
                    <button type="submit">Record purchase</button>
                </form>
                <div id="purchase-status" class="status-msg"></div>
            </div>

            <div class="card full-width">
                <h2>Purchase history</h2>
                <!-- FIX: Suppliers/Products already had search; History is the fastest-growing
                     table of the group and previously had no way to filter it at all -->
                <div class="toolbar">
                    <input type="text" id="purchase-search" class="search-input" placeholder="Search by supplier, warehouse or product…">
                    <div style="display:flex; gap:6px; flex-wrap:wrap;">
                        <button type="button" class="btn-ghost btn-small range-btn" data-days="30">Last 30 days</button>
                        <button type="button" class="btn-ghost btn-small range-btn" data-days="90">Last 90 days</button>
                        <button type="button" class="btn-ghost btn-small range-btn" data-days="">All time</button>
                    </div>
                    <button type="button" class="btn-ghost btn-small" id="purchase-export">Export CSV</button>
                </div>
                <div class="table-responsive">
                    <table id="purchase-table">
                        <thead>
                            <tr>
                                <th class="th-sort" data-key="purchase_date">Date</th>
                                <th class="th-sort" data-key="supplier_name">Supplier</th>
                                <th class="th-sort" data-key="warehouse_name">Warehouse</th>
                                <th class="th-sort" data-key="product_name">Product</th>
                                <th class="th-sort num" data-key="quantity">Qty</th>
                                <th class="th-sort num" data-key="unit_cost">Unit cost</th>
                                <th class="th-sort num" data-key="total_cost">Total</th>
                                <th style="text-align:center;">Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <button type="button" class="btn-ghost" id="purchase-load-more" style="margin-top:14px; display:none;">Load more</button>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/supabaseClient.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/ui-helpers.js"></script>
<script src="/js/table-view.js"></script>
<script>
renderSidebar("purchases");

// FIX: lets Inventory's low-stock "Reorder" link land here with the right
// Supplier + Product already picked, e.g. /purchases/index.html?supplier=1&product=5
const reorderParams = new URLSearchParams(window.location.search);
const preselectSupplier = reorderParams.get("supplier");
const preselectProduct = reorderParams.get("product");

// FIX: all three dropdown sources kept together so guardrails and the
// supplier->product cascade can be computed from one consistent snapshot.
let dropdownState = { suppliers: [], warehouses: [], products: [] };

async function loadDropdowns() {
    const [{ data: suppliers }, { data: warehouses }, { data: products }] = await Promise.all([
        supabaseClient.from("supplier").select("supplier_id, name").order("name"),
        supabaseClient.from("warehouse").select("warehouse_id, name").order("name"),
        supabaseClient.from("product").select("product_id, name, supplier_id").order("name")
    ]);

    dropdownState = { suppliers: suppliers || [], warehouses: warehouses || [], products: products || [] };

    document.getElementById("purchase-supplier").innerHTML =
        dropdownState.suppliers.map(s => `<option value="${s.supplier_id}">${escapeHtml(s.name)}</option>`).join("");
    document.getElementById("purchase-warehouse").innerHTML =
        dropdownState.warehouses.map(w => `<option value="${w.warehouse_id}">${escapeHtml(w.name)}</option>`).join("");

    const statusDiv = document.getElementById("purchase-status");

    // FIX: previously, if the URL's product param belonged to a different
    // supplier than the URL's supplier param, the product preselect
    // silently no-op'd (checked against the unfiltered product list, but
    // assigned into the by-then-filtered select) with zero visible
    // feedback. Now: a product param is trusted as the real intent of a
    // restock link ("restock THIS product"), and its own supplier_id wins
    // over a stale/mismatched supplier param -- with a note explaining
    // when that correction happened, and a clear error if the product
    // param doesn't exist at all.
    if (preselectProduct) {
        const product = dropdownState.products.find(p => String(p.product_id) === preselectProduct);
        if (!product) {
            statusDiv.textContent = "The product this restock link points to no longer exists — pick one manually below.";
            statusDiv.className = "status-msg status-error";
            updateFormState();
        } else {
            document.getElementById("purchase-supplier").value = product.supplier_id;
            updateFormState();
            document.getElementById("purchase-product").value = preselectProduct;
            const mismatched = preselectSupplier && String(preselectSupplier) !== String(product.supplier_id);
            statusDiv.textContent = mismatched
                ? `Supplier corrected to match "${product.name}" — check the quantity and cost, then submit.`
                : "Pre-filled from a low-stock Restock link — check the quantity and cost, then submit.";
            statusDiv.className = "status-msg status-ok";
        }
    } else if (preselectSupplier && dropdownState.suppliers.some(s => String(s.supplier_id) === preselectSupplier)) {
        document.getElementById("purchase-supplier").value = preselectSupplier;
        updateFormState();
    } else {
        updateFormState();
    }
}

// FIX: single function that (a) blocks the whole form with a helpful
// message if any prerequisite table is empty, and (b) filters the Product
// dropdown down to just the selected Supplier's products, so it's no
// longer possible to record e.g. "bought a Denim Jacket from TechSource
// Ltd" when Denim Jacket actually belongs to Global Textiles.
function updateFormState() {
    const submitBtn = document.querySelector("#purchase-form button[type=submit]");
    const warningDiv = document.getElementById("purchase-prereq-warning");
    const productSelect = document.getElementById("purchase-product");
    const noProductNote = document.getElementById("purchase-no-product-note");

    const missing = [];
    if (dropdownState.suppliers.length === 0) missing.push({ label: "supplier", href: "/suppliers/index.html" });
    if (dropdownState.warehouses.length === 0) missing.push({ label: "warehouse", href: "/warehouses/index.html" });
    if (dropdownState.products.length === 0) missing.push({ label: "product", href: "/products/index.html" });

    if (missing.length > 0) {
        warningDiv.innerHTML = missingPrereqHtml(missing);
        productSelect.innerHTML = "";
        noProductNote.style.display = "none";
        submitBtn.disabled = true;
        return;
    }
    warningDiv.innerHTML = "";

    const supplierId = document.getElementById("purchase-supplier").value;
    const filtered = dropdownState.products.filter(p => String(p.supplier_id) === String(supplierId));

    if (filtered.length === 0) {
        productSelect.innerHTML = `<option value="">— none —</option>`;
        noProductNote.textContent = "This supplier has no products yet. Add one on the Products page, or choose a different supplier.";
        noProductNote.style.display = "block";
        submitBtn.disabled = true;
    } else {
        productSelect.innerHTML = filtered.map(p => `<option value="${p.product_id}">${escapeHtml(p.name)}</option>`).join("");
        noProductNote.style.display = "none";
        submitBtn.disabled = false;
    }
}

document.getElementById("purchase-supplier").addEventListener("change", updateFormState);

let allPurchaseHistory = [];
let purchaseOffset = 0;
let purchaseHasMore = true;
let dateRangeDays = null; // null = all time
const PURCHASE_PAGE_SIZE = 100;

function applyDateRangeFilter(rows) {
    if (!dateRangeDays) return rows;
    const cutoff = Date.now() - dateRangeDays * 24 * 60 * 60 * 1000;
    return rows.filter(r => new Date(r.purchase_date).getTime() >= cutoff);
}

const purchaseView = createTableView({
    tableId: "purchase-table",
    searchId: "purchase-search",
    exportId: "purchase-export",
    colspan: 8,
    searchFields: ["supplier_name", "warehouse_name", "product_name"],
    emptyMsg: "No purchases recorded yet.",
    noMatchMsg: "No purchases match that search/range.",
    csvName: () => "purchases.csv",
    csvHeaders: ["Date", "Supplier", "Warehouse", "Product", "Qty", "Unit cost", "Total"],
    csvRow: r => [formatDate(r.purchase_date), r.supplier_name, r.warehouse_name, r.product_name, r.quantity, r.unit_cost, r.total_cost],
    rowHtml: r => `
        <td>${formatDate(r.purchase_date)}</td>
        <td>${escapeHtml(r.supplier_name)}</td>
        <td>${escapeHtml(r.warehouse_name)}</td>
        <td>${escapeHtml(r.product_name)}</td>
        <td class="num">${r.quantity}</td>
        <td class="num">${formatMoney(r.unit_cost)}</td>
        <td class="num">${formatMoney(r.total_cost)}</td>
        <td class="table-actions">
            <button type="button" class="btn-ghost btn-small btn-danger delete-btn" data-id="${r.purchase_id}" data-summary="${escapeHtml(r.product_name)} x${r.quantity} from ${escapeHtml(r.supplier_name)}, ${escapeHtml(formatMoney(r.total_cost))}">Delete</button>
        </td>
    `,
    afterRender: () => {
        document.querySelectorAll("#purchase-table .delete-btn").forEach(btn =>
            btn.addEventListener("click", () => deletePurchase(btn.dataset.id, btn.dataset.summary)));
    }
});

function refreshPurchaseView() {
    purchaseView.setRaw(applyDateRangeFilter(allPurchaseHistory));
}

function setActiveRange(days) {
    dateRangeDays = days;
    document.querySelectorAll(".range-btn").forEach(btn => {
        const btnDays = btn.dataset.days ? Number(btn.dataset.days) : null;
        const isActive = btnDays === days;
        btn.classList.toggle("is-active", isActive);
        btn.setAttribute("aria-pressed", String(isActive));
    });
    refreshPurchaseView();
}
document.querySelectorAll(".range-btn").forEach(btn => {
    btn.addEventListener("click", () => setActiveRange(btn.dataset.days ? Number(btn.dataset.days) : null));
});

// FIX: wired to trg_reverse_inventory_on_purchase_delete -- deleting here
// reverses the stock this purchase added, and is rejected by the database
// (not silently allowed) if that stock has already been sold elsewhere.
// FIX: the DB blocks this with a raw "violates check constraint
// inventory_quantity_check" message -- translated here into something a
// user can actually act on, without touching the trigger/schema itself.
function friendlyDeleteError(message) {
    if ((message || "").includes("inventory_quantity_check")) {
        return "Can't delete this purchase: some of that stock has already been sold or moved elsewhere, so reversing it would take inventory below zero.";
    }
    return "Could not delete: " + message;
}

// FIX: deleting a purchase reverses real inventory -- a meaningfully bigger
// risk than deleting a supplier/product with no dependents, so this gets a
// stronger tier than a single confirm(): the exact word DELETE must be
// typed, with the specific line item restated so there's no doubt what's
// being reversed. Still a native dialog (prompt()), consistent with the
// rest of the app's confirm()-based pattern -- no custom modal.
async function deletePurchase(id, summary) {
    const typed = prompt(
        `This reverses the stock added by:\n\n${summary || "purchase #" + id}\n\n` +
        `It will fail if that stock has already been sold. Type DELETE to confirm.`
    );
    if (typed !== "DELETE") return;

    const { error } = await supabaseClient.from("purchase").delete().eq("purchase_id", id);
    const statusDiv = document.getElementById("purchase-status");
    if (error) {
        statusDiv.textContent = friendlyDeleteError(error.message);
        statusDiv.className = "status-msg status-error";
        return;
    }
    statusDiv.textContent = "Purchase deleted — inventory reversed.";
    statusDiv.className = "status-msg status-ok";
    loadPurchaseHistory(true);
    loadPurchaseStats();
}

// FIX: replaced the hard .limit(50) (which also had no explicit ORDER BY on
// the outer query, relying on the view's internal ordering surviving an
// unordered wrapper call -- Postgres doesn't guarantee that) with real
// "Load more" pagination, so history isn't silently truncated once a
// project accumulates more than 50 purchases.
async function loadPurchaseHistory(reset) {
    if (reset) {
        purchaseOffset = 0;
        purchaseHasMore = true;
        allPurchaseHistory = [];
    }
    const loadMoreBtn = document.getElementById("purchase-load-more");
    loadMoreBtn.disabled = true;
    loadMoreBtn.textContent = "Loading…";

    const { data, error } = await supabaseClient
        .from("purchase_history")
        .select("*")
        .order("purchase_date", { ascending: false })
        .range(purchaseOffset, purchaseOffset + PURCHASE_PAGE_SIZE - 1);
    if (error) { console.error(error); return; }

    const rows = data || [];
    allPurchaseHistory = allPurchaseHistory.concat(rows);
    purchaseOffset += rows.length;
    purchaseHasMore = rows.length === PURCHASE_PAGE_SIZE;

    refreshPurchaseView();
    loadMoreBtn.style.display = purchaseHasMore ? "inline-block" : "none";
    loadMoreBtn.disabled = false;
    loadMoreBtn.textContent = "Load more";
}
document.getElementById("purchase-load-more").addEventListener("click", () => loadPurchaseHistory(false));

// Deliberate exception to "reuse what's already loaded": the visible
// history table is paginated, so it can't be honestly summed for an
// all-time total. One cheap query (two numeric columns, no join) covers
// all four stat tiles instead of quietly under-reporting from page 1 only.
async function loadPurchaseStats() {
    const { data, error } = await supabaseClient.from("purchase_item").select("purchase_id, quantity, unit_cost, product_id");
    if (error) { console.error(error); return; }
    const rows = data || [];
    const purchaseCount = new Set(rows.map(r => r.purchase_id)).size;
    const totalUnits = rows.reduce((sum, r) => sum + r.quantity, 0);
    const totalSpend = rows.reduce((sum, r) => sum + r.quantity * r.unit_cost, 0);
    const distinctProducts = new Set(rows.map(r => r.product_id)).size;

    animateCount(document.getElementById("stat-purchase-count"), purchaseCount);
    animateCount(document.getElementById("stat-units"), totalUnits);
    document.getElementById("stat-spend").textContent = formatMoney(totalSpend);
    animateCount(document.getElementById("stat-distinct-products"), distinctProducts);
}

// Translates known raised conditions into plain language, mirroring
// friendlyDeleteError() above -- covers stale-dropdown races (a product's
// supplier changing in another tab after this page's dropdowns loaded) and
// defense-in-depth behind the quantity/cost checks below.
function friendlyPurchaseError(message) {
    const msg = message || "";
    if (msg.includes("belongs to supplier")) {
        return "That product now belongs to a different supplier than shown here — reload the page and try again.";
    }
    if (msg.includes("violates check constraint") && (msg.includes("quantity") || msg.includes("unit_cost"))) {
        return "Quantity and unit cost must be positive numbers.";
    }
    if (msg.includes("violates foreign key constraint")) {
        return "The selected supplier, warehouse, or product no longer exists — refresh the page and try again.";
    }
    return "Error: " + msg;
}

document.getElementById("purchase-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const statusDiv = document.getElementById("purchase-status");
    const submitBtn = document.querySelector("#purchase-form button[type=submit]");

    const supplierSelect = document.getElementById("purchase-supplier");
    const warehouseSelect = document.getElementById("purchase-warehouse");
    const productSelect = document.getElementById("purchase-product");
    const warehouseId = parseInt(warehouseSelect.value);
    const productId = parseInt(productSelect.value);
    const unitCost = parseFloat(document.getElementById("purchase-cost").value);

    // FIX: read with Number(), not parseInt(), so a typed "2.5" is caught
    // by the integer check below instead of being silently truncated to 2
    // before validation ever sees it.
    const quantity = Number(document.getElementById("purchase-quantity").value);
    if (!Number.isFinite(quantity) || !Number.isInteger(quantity) || quantity <= 0) {
        statusDiv.textContent = "Quantity must be a whole number greater than zero.";
        statusDiv.className = "status-msg status-error";
        return;
    }

    // FIX: unit cost is always a whole number here too -- same rule as Product price.
    if (!Number.isInteger(unitCost)) {
        statusDiv.textContent = "Unit cost must be a whole number (no decimals).";
        statusDiv.className = "status-msg status-error";
        return;
    }
    if (unitCost < 0) {
        statusDiv.textContent = "Unit cost can't be negative.";
        statusDiv.className = "status-msg status-error";
        return;
    }

    // FIX: the page's own subtitle already warns purchases "can be deleted
    // afterward... but not edited" -- there was no actual review step
    // confirming that at the moment of commitment. A native confirm()
    // keeps this consistent with the rest of the app (no custom modal).
    const supplierName = supplierSelect.options[supplierSelect.selectedIndex]?.text ?? "?";
    const warehouseName = warehouseSelect.options[warehouseSelect.selectedIndex]?.text ?? "?";
    const productName = productSelect.options[productSelect.selectedIndex]?.text ?? "?";
    const total = quantity * unitCost;
    const proceed = confirm(
        `Record this purchase?\n\n` +
        `Supplier:  ${supplierName}\n` +
        `Warehouse: ${warehouseName}\n` +
        `Product:   ${productName}\n` +
        `Quantity:  ${quantity}\n` +
        `Unit cost: ${formatMoney(unitCost)}\n` +
        `Total:     ${formatMoney(total)}\n\n` +
        `Purchases can be deleted afterward, but not edited -- double-check the numbers above.`
    );
    if (!proceed) return;

    statusDiv.textContent = "Recording purchase…";
    statusDiv.className = "status-msg";

    // FIX: without this, clicking Submit twice quickly (or a slow network)
    // could record the same purchase twice before the first one lands.
    submitBtn.disabled = true;
    try {
        const { data, error } = await supabaseClient.rpc("place_purchase_api", {
            p_supplier_id: parseInt(supplierSelect.value),
            p_warehouse_id: warehouseId,
            p_product_id: productId,
            p_quantity: quantity,
            p_unit_cost: unitCost
        });

        if (error) {
            statusDiv.textContent = friendlyPurchaseError(error.message);
            statusDiv.className = "status-msg status-error";
            return;
        }

        // FIX: previously the confirmation was a dead end ("inventory updated" --
        // but updated to what?). Now it looks up the actual resulting stock level
        // and links straight to Inventory, so the effect of the action is visible
        // immediately instead of requiring a manual trip to another page.
        const { data: stockRow } = await supabaseClient
            .from("inventory")
            .select("quantity, product:product_id(name), warehouse:warehouse_id(name)")
            .eq("product_id", productId)
            .eq("warehouse_id", warehouseId)
            .maybeSingle();

        const stockNote = stockRow
            ? ` ${escapeHtml(stockRow.product?.name ?? "Product")} now has ${stockRow.quantity} units in ${escapeHtml(stockRow.warehouse?.name ?? "that warehouse")}.`
            : "";

        statusDiv.innerHTML = `Purchase #${data} recorded.${stockNote} <a href="/inventory/index.html">View Inventory &rarr;</a>`;
        statusDiv.className = "status-msg status-ok";
        document.getElementById("purchase-form").reset();
        loadPurchaseHistory(true);
        loadPurchaseStats();
    } finally {
        // FIX: re-derive the correct disabled state instead of blindly
        // re-enabling -- updateFormState() already disables the button
        // when the current supplier has no products, and that should win.
        updateFormState();
    }
});

setActiveRange(null); // default: all time, matching the page's previous unfiltered behavior
loadDropdowns();
loadPurchaseHistory(true);
loadPurchaseStats();
</script>

</body>
</html>
