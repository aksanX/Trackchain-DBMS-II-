<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrackChain — Staff Sign In</title>
<link rel="stylesheet" href="/css/style.css">
<style>
body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
}

.login-form-wrap {
    width: 100%;
    max-width: 400px;
}

.login-logo-mark {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin-bottom: 28px;
}

.login-logo-mark .logo-mark {
    width: 36px;
    height: 36px;
    background: var(--accent-gradient);
    color: #fff;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
}

.login-logo-mark .brand-name {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 18px;
}

.login-form-card h2 {
    font-size: 24px;
    margin-bottom: 4px;
    text-align: center;
}

.login-form-card .subtitle {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 20px;
    text-align: center;
}

.login-error-alert {
    background: rgba(239, 68, 68, 0.08);
    border: 1px solid rgba(239, 68, 68, 0.25);
    color: var(--error);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    margin-bottom: 16px;
    display: none;
}

.login-form-card button:disabled { opacity: 0.6; cursor: not-allowed; }

.login-footnote {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 20px;
}
</style>
</head>
<body>

<div class="login-form-wrap">

    <div class="login-logo-mark">
        <div class="logo-mark">S</div>
        <span class="brand-name">TrackChain</span>
    </div>

    <div class="card login-form-card">
        <h2>Sign in</h2>
        <div class="subtitle">Enter your staff credentials to authenticate</div>

        <div id="login-error" class="login-error-alert"></div>

        <form id="login-form">
            <label for="email-input">Email</label>
            <input type="email" id="email-input" placeholder="you@company.com" required autocomplete="username">

            <label for="password-input">Password</label>
            <input type="password" id="password-input" placeholder="••••••••" required autocomplete="current-password">

            <button type="submit" id="submit-btn">Sign in to dashboard →</button>
        </form>
    </div>

    <p class="login-footnote">Don't have an account? Ask an admin to create one for you.</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/supabaseClient.js"></script>
<script src="/js/role-guard.js"></script>
<script>
(async () => {
    await initAuth();
    if (getLoggedInUser()) {
        window.location.href = "/index.html";
    }
})();

document.getElementById("login-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const emailVal = document.getElementById("email-input").value;
    const passVal = document.getElementById("password-input").value;
    const errorBox = document.getElementById("login-error");
    const submitBtn = document.getElementById("submit-btn");

    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in…";
    errorBox.style.display = "none";

    try {
        const result = await loginWithPassword(emailVal, passVal);
        if (result.success) {
            window.location.href = "/index.html";
            return;
        }
        errorBox.textContent = result.message;
        errorBox.style.display = "block";
    } catch (err) {
        console.error("Login failed:", err);
        errorBox.textContent = "Unexpected error: " + (err.message || err);
        errorBox.style.display = "block";
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign in to dashboard →";
    }
});
</script>

</body>
</html>
